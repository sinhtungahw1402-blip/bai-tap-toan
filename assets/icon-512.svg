<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="azotaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1e3a8a" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="112" fill="url(#azotaGrad)"/>
  
  <!-- Subtle Grid Lines -->
  <path d="M64 160h384M64 256h384M64 352h384M160 64v384M256 64v384M352 64v384" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  
  <!-- Math Graph Curve -->
  <path d="M96 380 Q 200 120, 256 256 T 416 130" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="8" stroke-linecap="round"/>

  <!-- Math Symbol: Sigma & Pi -->
  <g filter="url(#glow)">
    <!-- Main Sigma Symbol -->
    <path d="M140 148 h232 v48 l-130 110 130 110 v48 H140 v-52 h146 l-96 -82 96 -82 H140 z" fill="#ffffff"/>
  </g>

  <!-- Accent Math Badge (Square root / checkmark) -->
  <circle cx="390" cy="120" r="56" fill="url(#goldGrad)" filter="url(#glow)"/>
  <path d="M362 120 l20 20 40 -40" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
